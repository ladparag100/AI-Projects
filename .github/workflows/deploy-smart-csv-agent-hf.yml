name: Deploy Smart CSV Agent to Hugging Face Spaces

on:
  push:
    branches: [main]
    paths:
      - "1-Smart-CSV-Agent/**"
      - ".github/workflows/deploy-smart-csv-agent-hf.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build Space snapshot
        run: |
          rm -rf /tmp/space-deploy
          mkdir -p /tmp/space-deploy
          cp -r 1-Smart-CSV-Agent/. /tmp/space-deploy/
          cat > /tmp/space-deploy/README.md <<'EOF'
          ---
          title: Smart CSV Agent
          emoji: 📊
          colorFrom: blue
          colorTo: indigo
          sdk: docker
          app_port: 7860
          pinned: false
          ---
          # Smart CSV Agent
          An AI agent by Parag Lad that answers questions across multiple CSV files
          using LangChain and OpenAI. Upload CSV files and ask questions in plain
          English.
          Full project source: https://github.com/ladparag100/AI-Projects/tree/main/1-Smart-CSV-Agent
          EOF

      - name: Push to Hugging Face Space
        run: |
          cd /tmp/space-deploy
          git init -q
          git checkout -q -b main
          git config user.email "ladparag100@gmail.com"
          git config user.name "ladparag100"
          git remote add space https://ladparag:${HF_TOKEN}@huggingface.co/spaces/ladparag/smart-csv-agent
          git add -A
          git commit -q -m "Deploy from GitHub Actions ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push -q -f space main
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
