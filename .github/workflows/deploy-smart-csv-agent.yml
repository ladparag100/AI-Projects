name: Deploy Smart CSV Agent to Snowflake

# Manual trigger only - parked in favor of Hugging Face Spaces because the
# Snowflake trial account's compute pool couldn't satisfy the app's
# dependencies. Kept here in case that changes.
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 1-Smart-CSV-Agent
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - run: pip install snowflake-cli
      - run: |
          mkdir -p ~/.snowflake
          cat <<EOF > ~/.snowflake/config.toml
          [connections.default]
          account = "godyliz-qu74489"
          user = "LADPARAG"
          password = "${{ secrets.SNOWFLAKE_PASSWORD }}"
          role = "ACCOUNTADMIN"
          warehouse = "COMPUTE_WH"
          database = "AI_PROJECTS"
          schema = "PUBLIC"
          EOF
          chmod 0600 ~/.snowflake/config.toml
      - run: snow sql -q "CREATE DATABASE IF NOT EXISTS AI_PROJECTS; CREATE SCHEMA IF NOT EXISTS AI_PROJECTS.PUBLIC;"
      - run: snow streamlit deploy --replace
